syntax = "proto3";

package productservice;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/zxCroshka/ecommerce/shared/productservice/gen/go;productservicev1";

service Products {
	// Public catalog operations.
	rpc GetProduct(GetProductRequest) returns (GetProductResponse);
	rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

	// Administrator operations.
	rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
	rpc UpdateProductFields(UpdateProductFieldsRequest) returns (UpdateProductFieldsResponse);
	rpc SoftDelete(SoftDeleteRequest) returns (SoftDeleteResponse);

	// Internal stock operations. They must be protected by service-to-service auth.
	rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
	rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message GetProductRequest {
	int64 product_id = 1;
}

message Product {
	int64 id = 1;
	string name = 2;
	string description = 3;
	int64 price = 4;
	int64 stock = 5;
	string category = 6;
	repeated string images = 7;
	bool is_active = 9;
	google.protobuf.Timestamp created_at = 8;
	google.protobuf.Timestamp updated_at = 10;
}

message GetProductResponse {
	Product product = 1;
}

message ListProductsRequest {
	optional string category = 1;
	optional bool is_active = 2;
	ProductSortField sort = 3;
	ProductSortOrder order = 4;
	int32 limit = 5;
	int32 offset = 6;
}

message ListProductsResponse {
	repeated Product products = 1;
	int64 total = 2;
	int32 limit = 3;
	int32 offset = 4;
}

enum ProductSortField {
	PRODUCT_SORT_FIELD_UNSPECIFIED = 0;
	PRODUCT_SORT_FIELD_PRICE = 1;
	PRODUCT_SORT_FIELD_NAME = 2;
	PRODUCT_SORT_FIELD_CREATED_AT = 3;
}

enum ProductSortOrder {
	PRODUCT_SORT_ORDER_UNSPECIFIED = 0;
	PRODUCT_SORT_ORDER_ASC = 1;
	PRODUCT_SORT_ORDER_DESC = 2;
}

message CreateProductRequest {
	string name = 1;
	string description = 2;
	int64 price = 3;
	int64 stock = 4;
	string category = 5;
	repeated string images = 6;
	optional bool is_active = 7;
}

message CreateProductResponse {
	int64 product_id = 1;
}

// Scalar fields use proto3 presence, so zero values are valid patch values.
// Images are wrapped in a message to distinguish an omitted field from
// an explicitly supplied empty list.
message UpdateProductFieldsRequest {
	int64 product_id = 1;
	optional string name = 2;
	optional string description = 3;
	optional int64 price = 4;
	optional int64 stock = 5;
	optional string category = 6;
	ProductImages images = 7;
	optional bool is_active = 8;
}

message ProductImages {
	repeated string values = 1;
}

message UpdateProductFieldsResponse {}

message SoftDeleteRequest {
	int64 product_id = 1;
}

message SoftDeleteResponse {}

message ReserveStockRequest {
	int64 product_id = 1;
	int64 quantity = 2;
	string reservation_id = 3;
}

message ReserveStockResponse {}

message ReleaseStockRequest {
	int64 product_id = 1;
	string reservation_id = 2;
}

message ReleaseStockResponse {}
