syntax = "proto3";

package cartservice;

option go_package = "github.com/zxCroshka/ecommerce/shared/cartservice/gen/go;cartservicev1";

service Cart {
	rpc GetCart(GetCartRequest) returns (GetCartResponse);
	rpc AddProduct(AddProductRequest) returns (AddProductResponse);
	rpc RemoveProduct(RemoveProductRequest) returns (RemoveProductResponse);
	rpc ChangeProductQuantity(ChangeProductQuantityRequest) returns (ChangeProductQuantityResponse);
	rpc CheckoutCart(CheckoutCartRequest) returns (CheckoutCartResponse);
}

message CartItem {
	int64 product_id = 1;
	int64 quantity = 2;
}

message GetCartRequest {
	int64 user_id = 1;
}

message GetCartResponse {
	repeated CartItem items = 1;
}

message AddProductRequest {
	int64 user_id = 1;
	CartItem product = 2;
}

message AddProductResponse {
	int64 new_quantity = 1;
	int64 current_quantity = 2;
}

message RemoveProductRequest {
	int64 user_id = 1;
	int64 product_id = 2;
}

message RemoveProductResponse {}

message ChangeProductQuantityRequest {
	int64 user_id = 1;
	CartItem product = 2;
}

message ChangeProductQuantityResponse {}

message CheckoutCartRequest {
	int64 user_id = 1;
}

message CheckoutCartResponse {
	repeated CartItem items = 1;
}
