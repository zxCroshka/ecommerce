service:
  name: "ecommerce-service-user"
  environment: "local"

grpc:
  host: "0.0.0.0"
  port: 9090

postgres:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "ecommerce"
  sslmode: "disable"

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0

kafka:
  brokers:
    - "localhost:9092"
  topic:
    user_registered: "user.registered"

outbox:
  poll_interval: "500ms"
  publish_timeout: "5s"
  store_timeout: "2s"
  lock_timeout: "30s"
  retry_base_delay: "1s"
  retry_max_delay: "1m"
  batch_size: 50

jwt:
  secret: "local-dev-secret-key-2024-change-me-in-production"
  access_ttl: "15m"
  refresh_ttl: "168h"

logging:
  level: "debug"
  format: "json"

pprof:
  enabled: false
